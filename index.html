<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Mensal de Marketing — Demo</title>
<style>
/* ===== MARCA DA AGÊNCIA (troque aqui pra cada agência) ===== */
:root{
  --marca:#6250d6;          /* cor principal da agência */
  --surface-0:#f4f4f2; --surface-1:#fcfcfb; --borda:#e4e3df;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a8984;
  --grid:#ecebe7;
  --series-1:#2a78d6;       /* Meta Ads */
  --series-2:#eb6834;       /* Google Ads */
  --good:#008300; --critical:#c62828;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface-0:#111110; --surface-1:#1a1a19; --borda:#2c2c2a;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --grid:#2a2a28; --series-1:#3987e5; --series-2:#d95926; --marca:#9085e9;
    --good:#0ca30c; --critical:#e66767;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--surface-0);color:var(--text-primary);font-size:14px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:10px;background:var(--marca);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.titulo h1{font-size:20px;font-weight:650}
.titulo p{color:var(--text-secondary);font-size:13px}
.filtros{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.filtros label{font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column;gap:4px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--borda);background:var(--surface-1);color:var(--text-primary);min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--surface-1);border:1px solid var(--borda);border-radius:12px;padding:16px}
.kpi .rot{font-size:12px;color:var(--text-secondary)}
.kpi .val{font-size:26px;font-weight:650;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .var{font-size:12px;color:var(--text-muted)}
.var .up{color:var(--good)} .var .down{color:var(--critical)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.filtros{margin-left:0}}
.card h2{font-size:14px;font-weight:600;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg text{fill:var(--text-muted);font-size:11px}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--borda);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5}
.tip b{display:block;margin-bottom:3px}
.tip .l{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.tip .l i{width:8px;height:8px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;padding:8px;border-bottom:1px solid var(--borda)}
td{padding:9px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.pill i{width:8px;height:8px;border-radius:2px}
.resumo{font-size:13px;color:var(--text-secondary);line-height:1.6}
.resumo b{color:var(--text-primary)}
footer{margin-top:18px;font-size:12px;color:var(--text-muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">PD</div>
    <div class="titulo">
      <h1 id="tituloRel">Relatório Mensal de Marketing</h1>
      <p id="subRel"></p>
    </div>
    <div class="filtros">
      <label>Mês<select id="fMes"></select></label>
      <label>Canal<select id="fCanal">
        <option value="todos">Todos os canais</option>
        <option value="Meta Ads">Meta Ads</option>
        <option value="Google Ads">Google Ads</option>
      </select></label>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <h2>Leads por mês</h2>
      <p class="sub">Contatos gerados pelas campanhas, últimos 6 meses</p>
      <div class="legenda" id="leg1"></div>
      <div class="chart" id="cLeads"></div>
    </div>
    <div class="card">
      <h2>Custo por lead (R$)</h2>
      <p class="sub">Quanto custou, em média, cada contato</p>
      <div class="legenda" id="leg2"></div>
      <div class="chart" id="cCpl"></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:14px">
    <h2>Campanhas do mês</h2>
    <p class="sub" id="subCamp"></p>
    <div style="overflow-x:auto"><table id="tCamp"></table></div>
  </section>

  <section class="card">
    <h2>Resumo do mês</h2>
    <p class="resumo" id="resumo"></p>
  </section>

  <footer id="rodape"></footer>
</div>

<script>
/* ================= CONFIGURAÇÃO =================
   AGENCIA / CLIENTE: troque pra cada relatório (white-label).
   PLANILHA_CSV: opcional. Cole aqui o link de uma Planilha Google publicada
   como CSV (Arquivo > Compartilhar > Publicar na Web > CSV).
   Colunas: mes,canal,campanha,investimento,impressoes,cliques,leads
   (mes no formato 2026-11). Se ficar vazio, usa os dados de exemplo abaixo. */
const CONFIG = {
  AGENCIA: "Pulso Digital",
  SIGLA: "PD",
  CLIENTE: "Clínica Sorriso Leve",
  PLANILHA_CSV: ""
};

/* Dados fictícios de exemplo */
const DADOS_EXEMPLO = (() => {
  const meses = ["2026-06","2026-07","2026-08","2026-09","2026-10","2026-11"];
  const camps = [
    ["Meta Ads","Clareamento - Leads", 900, 1.00],
    ["Meta Ads","Implante - Remarketing", 650, 0.55],
    ["Meta Ads","Avaliação gratuita", 500, 0.80],
    ["Google Ads","Pesquisa - Dentista perto de mim", 800, 0.70],
    ["Google Ads","Pesquisa - Implante dentário", 600, 0.45]
  ];
  const cresc = [0.82,0.9,0.95,1.0,1.08,1.15];
  const ruido = [1,0.96,1.04,0.98,1.03,1.01];
  const rows = [];
  meses.forEach((m,i)=>camps.forEach(([canal,nome,inv,efic],j)=>{
    const r = ruido[(i+j)%6];
    const investimento = Math.round(inv*cresc[i]*r);
    const cpm = canal==="Meta Ads" ? 14 : 38;
    const impressoes = Math.round(investimento/cpm*1000);
    const ctr = canal==="Meta Ads" ? 0.011 : 0.052;
    const cliques = Math.round(impressoes*ctr*(0.95+0.1*r));
    const conv = canal==="Meta Ads" ? 0.085 : 0.11;
    const leads = Math.round(cliques*conv*efic*(0.9+0.12*i/5)*r);
    rows.push({mes:m,canal,campanha:nome,investimento,impressoes,cliques,leads});
  }));
  return rows;
})();

const CANAIS = ["Meta Ads","Google Ads"];
const COR = {"Meta Ads":"var(--series-1)","Google Ads":"var(--series-2)"};
const NOME_MES = m => {const [a,n]=m.split("-");return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+n-1]+"/"+a.slice(2)};
const NOME_MES_LONGO = m => {const [a,n]=m.split("-");return ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][+n-1]+" de "+a};
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:v<100?2:0});
const num = v => v.toLocaleString("pt-BR");
const pct = v => (v*100).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";

let DADOS = [], MESES = [];

function soma(rows){
  const s = {investimento:0,impressoes:0,cliques:0,leads:0};
  rows.forEach(r=>{for(const k in s) s[k]+=r[k]});
  s.cpl = s.leads ? s.investimento/s.leads : 0;
  s.ctr = s.impressoes ? s.cliques/s.impressoes : 0;
  return s;
}
const filtra = (mes,canal) => DADOS.filter(r=>(!mes||r.mes===mes)&&(canal==="todos"||r.canal===canal));

function render(){
  const mes = fMes.value, canal = fCanal.value;
  const iM = MESES.indexOf(mes), mesAnt = MESES[iM-1];
  const atual = soma(filtra(mes,canal)), ant = mesAnt ? soma(filtra(mesAnt,canal)) : null;

  document.getElementById("subRel").textContent =
    `${CONFIG.CLIENTE} · ${NOME_MES_LONGO(mes)} · preparado por ${CONFIG.AGENCIA}`;

  // KPIs
  const kp = [
    ["Investimento", brl(atual.investimento), "investimento", false],
    ["Leads", num(atual.leads), "leads", false],
    ["Custo por lead", brl(atual.cpl), "cpl", true],
    ["Cliques", num(atual.cliques), "cliques", false],
    ["Taxa de cliques", pct(atual.ctr), "ctr", false]
  ];
  document.getElementById("kpis").innerHTML = kp.map(([rot,val,k,menorMelhor])=>{
    let v = "sem mês anterior";
    if(ant && ant[k]){
      const d = (atual[k]-ant[k])/ant[k];
      const bom = menorMelhor ? d<0 : d>0;
      const cls = k==="investimento" ? "" : (bom?"up":"down");
      v = `<span class="${cls}">${d>=0?"▲":"▼"} ${pct(Math.abs(d))}</span> vs ${NOME_MES(mesAnt)}`;
    }
    return `<div class="card kpi"><div class="rot">${rot}</div><div class="val">${val}</div><div class="var">${v}</div></div>`;
  }).join("");

  const canaisVis = canal==="todos" ? CANAIS : [canal];
  const leg = canaisVis.length>1 ? canaisVis.map(c=>`<span><i style="background:${COR[c]}"></i>${c}</span>`).join("") : "";
  leg1.innerHTML = leg; leg2.innerHTML = leg;

  barras(canaisVis, mes);
  linhas(canaisVis, mes);
  tabela(mes, canal);
  resumo(atual, ant, mes, mesAnt, canal);
  rodape.textContent = `Relatório gerado por ${CONFIG.AGENCIA}. Dados das plataformas de anúncio.`;
}

function eixoY(max){
  const passos=[1,2,2.5,5,10]; const bruto=max/4;
  const pot=Math.pow(10,Math.floor(Math.log10(bruto||1)));
  const p=passos.find(s=>s*pot>=bruto)*pot; return [p, Math.ceil(max/p)*p];
}

function svgBase(el, dir=10){
  const W = el.clientWidth || 520, H = 230, m = {t:10,r:dir,b:26,l:44};
  return {W,H,m,iw:W-m.l-m.r,ih:H-m.t-m.b};
}

function tooltip(el){
  let t = el.querySelector(".tip");
  if(!t){t=document.createElement("div");t.className="tip";el.appendChild(t)}
  return t;
}
function mostraTip(el,html,x,y){
  const t=tooltip(el); t.innerHTML=html; t.style.opacity=1;
  const w=t.offsetWidth; const W=el.clientWidth;
  t.style.left=Math.min(Math.max(x-w/2,0),W-w)+"px"; t.style.top=(y-t.offsetHeight-10)+"px";
}
function escondeTip(el){const t=tooltip(el);t.style.opacity=0}

function barras(canaisVis, mesSel){
  const el = document.getElementById("cLeads"); const {W,H,m,iw,ih} = svgBase(el);
  const serie = MESES.map(mm=>canaisVis.map(c=>soma(filtra(mm,c)).leads));
  const max = Math.max(...serie.flat(),1); const [passo,topo] = eixoY(max);
  const gw = iw/MESES.length, bw = Math.min(26,(gw*0.6)/canaisVis.length);
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Leads por mês">`;
  for(let v=0;v<=topo;v+=passo){const y=m.t+ih-(v/topo)*ih;
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${m.l-8}" y="${y+4}" text-anchor="end">${num(v)}</text>`}
  MESES.forEach((mm,i)=>{
    const gx = m.l+i*gw+gw/2, larg = bw*canaisVis.length+2*(canaisVis.length-1);
    canaisVis.forEach((c,j)=>{
      const v=serie[i][j], h=(v/topo)*ih, x=gx-larg/2+j*(bw+2), y=m.t+ih-h;
      const op = mm===mesSel?1:0.45;
      s+=`<path d="M${x},${m.t+ih} V${y+4} a4,4 0 0 1 4,-4 h${bw-8} a4,4 0 0 1 4,4 V${m.t+ih} Z" fill="${COR[c]}" opacity="${op}"/>`;
    });
    s+=`<text x="${gx}" y="${H-8}" text-anchor="middle" ${mm===mesSel?'style="fill:var(--text-primary);font-weight:600"':''}>${NOME_MES(mm)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${m.l+i*gw}" y="${m.t}" width="${gw}" height="${ih}" fill="transparent"/>`;
  });
  s+=`</svg>`; el.innerHTML=s;
  el.querySelectorAll(".hit").forEach(r=>{
    r.addEventListener("mousemove",()=>{const i=+r.dataset.i;
      const html=`<b>${NOME_MES_LONGO(MESES[i])}</b>`+canaisVis.map((c,j)=>`<div class="l"><i style="background:${COR[c]}"></i>${c}: ${num(serie[i][j])} leads</div>`).join("");
      mostraTip(el,html,m.l+i*gw+gw/2,m.t+20)});
    r.addEventListener("mouseleave",()=>escondeTip(el));
  });
}

function linhas(canaisVis, mesSel){
  const el = document.getElementById("cCpl"); const {W,H,m,iw,ih} = svgBase(el, 28);
  const serie = canaisVis.map(c=>MESES.map(mm=>soma(filtra(mm,c)).cpl));
  const max = Math.max(...serie.flat(),1); const [passo,topo] = eixoY(max*1.1);
  const xs = i => m.l + (iw/(MESES.length-1))*i;
  const ys = v => m.t+ih-(v/topo)*ih;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Custo por lead">`;
  for(let v=0;v<=topo;v+=passo){const y=ys(v);
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${m.l-8}" y="${y+4}" text-anchor="end">${num(v)}</text>`}
  MESES.forEach((mm,i)=>s+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle" ${mm===mesSel?'style="fill:var(--text-primary);font-weight:600"':''}>${NOME_MES(mm)}</text>`);
  s+=`<line id="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-muted)" stroke-dasharray="3 3" opacity="0"/>`;
  serie.forEach((arr,j)=>{
    const c=canaisVis[j];
    s+=`<path d="${arr.map((v,i)=>(i?"L":"M")+xs(i)+","+ys(v)).join(" ")}" fill="none" stroke="${COR[c]}" stroke-width="2" stroke-linejoin="round"/>`;
    const iS = MESES.indexOf(mesSel);
    s+=`<circle cx="${xs(iS)}" cy="${ys(arr[iS])}" r="5" fill="${COR[c]}" stroke="var(--surface-1)" stroke-width="2"/>`;
  });
  s+=`<rect id="hitL" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML=s;
  const hit=el.querySelector("#hitL"), cross=el.querySelector("#cross");
  hit.addEventListener("mousemove",e=>{
    const rx=e.offsetX-m.l; const i=Math.max(0,Math.min(MESES.length-1,Math.round(rx/(iw/(MESES.length-1)))));
    cross.setAttribute("x1",xs(i));cross.setAttribute("x2",xs(i));cross.setAttribute("opacity",1);
    const html=`<b>${NOME_MES_LONGO(MESES[i])}</b>`+canaisVis.map((c,j)=>`<div class="l"><i style="background:${COR[c]}"></i>${c}: ${brl(serie[j][i])}</div>`).join("");
    mostraTip(el,html,xs(i),m.t+20)});
  hit.addEventListener("mouseleave",()=>{cross.setAttribute("opacity",0);escondeTip(el)});
}

function tabela(mes, canal){
  const rows = filtra(mes,canal).map(r=>({...r,cpl:r.leads?r.investimento/r.leads:0})).sort((a,b)=>b.leads-a.leads);
  subCamp.textContent = `${rows.length} campanhas ativas em ${NOME_MES_LONGO(mes)}, ordenadas por leads`;
  tCamp.innerHTML = `<tr><th>Campanha</th><th>Canal</th><th class="n">Investimento</th><th class="n">Cliques</th><th class="n">Leads</th><th class="n">Custo por lead</th></tr>`+
    rows.map(r=>`<tr><td>${r.campanha}</td><td><span class="pill"><i style="background:${COR[r.canal]}"></i>${r.canal}</span></td><td class="n">${brl(r.investimento)}</td><td class="n">${num(r.cliques)}</td><td class="n">${num(r.leads)}</td><td class="n">${brl(r.cpl)}</td></tr>`).join("");
}

function resumo(a, ant, mes, mesAnt, canal){
  const rows = filtra(mes,canal).map(r=>({...r,cpl:r.leads?r.investimento/r.leads:Infinity}));
  const melhor = rows.slice().sort((x,y)=>x.cpl-y.cpl)[0];
  let t = `Em <b>${NOME_MES_LONGO(mes)}</b>, as campanhas geraram <b>${num(a.leads)} leads</b> com investimento de <b>${brl(a.investimento)}</b>, um custo médio de <b>${brl(a.cpl)}</b> por lead.`;
  if(ant && ant.leads){
    const d=(a.leads-ant.leads)/ant.leads;
    t+=` Foram ${pct(Math.abs(d))} ${d>=0?"a mais":"a menos"} que em ${NOME_MES_LONGO(mesAnt)}.`;
  }
  if(melhor) t+=` A campanha mais eficiente foi <b>${melhor.campanha}</b> (${melhor.canal}), com lead a ${brl(melhor.cpl)}.`;
  document.getElementById("resumo").innerHTML = t;
}

function parseCSV(txt){
  const [cab,...linhas] = txt.trim().split(/\r?\n/);
  const cols = cab.split(",").map(s=>s.trim().toLowerCase());
  return linhas.map(l=>{const v=l.split(","); const o={};
    cols.forEach((c,i)=>o[c]=["mes","canal","campanha"].includes(c)?v[i].trim():Number(v[i])); return o});
}

async function iniciar(){
  document.getElementById("logo").textContent = CONFIG.SIGLA;
  document.title = `Relatório ${CONFIG.CLIENTE} — ${CONFIG.AGENCIA}`;
  DADOS = DADOS_EXEMPLO;
  if(CONFIG.PLANILHA_CSV){
    try{ DADOS = parseCSV(await (await fetch(CONFIG.PLANILHA_CSV)).text()); }
    catch(e){ console.warn("Não consegui ler a planilha, usando dados de exemplo.", e); }
  }
  MESES = [...new Set(DADOS.map(r=>r.mes))].sort();
  fMes.innerHTML = MESES.slice().reverse().map(m=>`<option value="${m}">${NOME_MES_LONGO(m)}</option>`).join("");
  fMes.onchange = render; fCanal.onchange = render;
  window.addEventListener("resize", render);
  render();
}
iniciar();
</script>
</body>
</html>
